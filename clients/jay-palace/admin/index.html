<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Jay Palace Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080f1e; --bg2: #0c1729; --surface: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.09); --gold: #C9A84C; --gold-light: #E8C96D;
      --text: #fff; --muted: rgba(255,255,255,.55);
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
    }
    body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }

    /* LOGIN */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: #0c1729; border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; }
    .login-logo { font-size: 1.25rem; font-weight: 900; color: var(--gold); text-align: center; margin-bottom: 6px; }
    .login-subtitle { text-align: center; font-size: .875rem; color: var(--muted); margin-bottom: 32px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .login-field input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: .9rem;
    }
    .login-field input:focus { outline: none; border-color: var(--gold); }
    .btn-login { width: 100%; background: var(--gold); color: #000; border: none; padding: 13px; border-radius: 9999px; font-size: .9375rem; font-weight: 800; margin-top: 8px; }
    .login-error { margin-top: 12px; font-size: .8rem; color: var(--danger); text-align: center; }

    /* ADMIN LAYOUT */
    .admin-wrap { display: none; }
    .admin-header {
      background: rgba(8,15,30,.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .admin-logo { font-size: 1rem; font-weight: 900; color: var(--gold); }
    .admin-logo span { font-weight: 400; color: var(--muted); font-size: .8rem; }
    .admin-header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .admin-user { font-size: .8rem; color: var(--muted); }
    .btn-logout { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 9999px; font-size: .8rem; }
    .btn-logout:hover { color: var(--text); }

    .admin-body { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* STAT CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .stat-label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 900; }
    .stat-card.pending .stat-value { color: var(--warning); }
    .stat-card.confirmed .stat-value { color: var(--success); }
    .stat-card.paid .stat-value { color: var(--gold); }
    .stat-card.total .stat-value { color: var(--text); }

    /* FILTER TABS */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 7px 18px; border-radius: 9999px;
      font-size: .8125rem; font-weight: 600;
    }
    .tab.active { background: var(--gold); border-color: var(--gold); color: #000; }
    .tab:hover:not(.active) { border-color: rgba(255,255,255,.25); color: var(--text); }

    /* BOOKING CARDS */
    .bookings-list { display: flex; flex-direction: column; gap: 14px; }
    .booking-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; display: grid;
      grid-template-columns: 1fr 1fr 1fr auto; gap: 16px; align-items: start;
    }
    .booking-card.status-pending  { border-left: 4px solid var(--warning); }
    .booking-card.status-approved { border-left: 4px solid var(--success); }
    .booking-card.status-rejected { border-left: 4px solid var(--danger); }
    .booking-card.status-paid     { border-left: 4px solid var(--gold); }

    .booking-id { font-size: .7rem; font-weight: 700; color: var(--gold); letter-spacing: .08em; margin-bottom: 4px; }
    .booking-guest { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
    .booking-phone { font-size: .85rem; color: var(--muted); }
    .booking-room { font-size: .9375rem; font-weight: 700; margin-bottom: 3px; }
    .booking-dates { font-size: .8rem; color: var(--muted); margin-bottom: 3px; }
    .booking-guests { font-size: .8rem; color: var(--muted); }
    .booking-amount { font-size: 1.2rem; font-weight: 900; color: var(--gold-light); margin-bottom: 4px; }
    .booking-nights { font-size: .75rem; color: var(--muted); }
    .booking-special { font-size: .75rem; color: var(--warning); margin-top: 4px; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 9999px;
      font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .badge-pending  { background: rgba(245,158,11,.15); color: var(--warning); border: 1px solid rgba(245,158,11,.3); }
    .badge-approved { background: rgba(16,185,129,.15); color: var(--success); border: 1px solid rgba(16,185,129,.3); }
    .badge-rejected { background: rgba(239,68,68,.15);  color: var(--danger);  border: 1px solid rgba(239,68,68,.3); }
    .badge-paid     { background: rgba(201,168,76,.15); color: var(--gold);    border: 1px solid rgba(201,168,76,.3); }

    .booking-actions { display: flex; flex-direction: column; gap: 8px; min-width: 160px; }
    .btn-approve { background: var(--success); color: #fff; border: none; padding: 9px 16px; border-radius: 9999px; font-size: .8125rem; font-weight: 700; }
    .btn-approve:hover { opacity: .9; }
    .btn-reject  { background: transparent; color: var(--danger); border: 1px solid rgba(239,68,68,.4); padding: 8px 16px; border-radius: 9999px; font-size: .8125rem; font-weight: 700; }
    .btn-reject:hover  { background: rgba(239,68,68,.1); }
    .btn-wa      { background: #25d366; color: #fff; border: none; padding: 9px 16px; border-radius: 9999px; font-size: .8125rem; font-weight: 700; }
    .btn-wa:hover { opacity: .9; }
    .btn-pay     { background: var(--gold); color: #000; border: none; padding: 9px 16px; border-radius: 9999px; font-size: .8125rem; font-weight: 700; }
    .btn-pay:hover { opacity: .9; }
    .btn-invoice { background: var(--info); color: #fff; border: none; padding: 9px 16px; border-radius: 9999px; font-size: .8125rem; font-weight: 700; }
    .btn-invoice:hover { opacity: .9; }

    .empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    /* PAYMENT MODAL */
    .pay-modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.75); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 16px; }
    .pay-modal-overlay.open { display: flex; }
    .pay-modal { background: #0c1729; border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; }
    .pay-modal h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; }
    .pay-summary { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .pay-row { display: flex; justify-content: space-between; font-size: .875rem; margin-bottom: 8px; }
    .pay-row.total { font-weight: 800; font-size: 1.1rem; padding-top: 10px; border-top: 1px solid var(--border); margin-bottom: 0; }
    .pay-row.total span:last-child { color: var(--gold-light); }
    .btn-pay-razorpay { width: 100%; background: #2E86C1; color: #fff; border: none; padding: 13px; border-radius: 9999px; font-size: .9375rem; font-weight: 800; margin-bottom: 10px; }
    .btn-pay-close { width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 11px; border-radius: 9999px; font-size: .875rem; }

    /* LOADING */
    .loading { text-align: center; padding: 40px; color: var(--muted); }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .booking-card { grid-template-columns: 1fr 1fr; }
      .booking-actions { flex-direction: row; flex-wrap: wrap; min-width: unset; grid-column: 1 / -1; }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .booking-card { grid-template-columns: 1fr; }
      .admin-body { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">✦ Jay Palace</div>
    <div class="login-subtitle">Hotel Admin Panel</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="owner@jaypalace.in">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••"
             onkeypress="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">Login</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-wrap" id="adminWrap">
  <header class="admin-header">
    <div class="admin-logo">✦ Jay Palace <span>· Admin</span></div>
    <div class="admin-header-right">
      <span class="admin-user" id="adminUser"></span>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="admin-body">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card pending">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="statPending">—</div>
      </div>
      <div class="stat-card confirmed">
        <div class="stat-label">Confirmed</div>
        <div class="stat-value" id="statApproved">—</div>
      </div>
      <div class="stat-card paid">
        <div class="stat-label">Paid</div>
        <div class="stat-value" id="statPaid">—</div>
      </div>
      <div class="stat-card total">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value" id="statRevenue">—</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-tabs">
      <button class="tab active" onclick="filterBookings('all', this)">All</button>
      <button class="tab" onclick="filterBookings('pending', this)">Pending</button>
      <button class="tab" onclick="filterBookings('approved', this)">Approved</button>
      <button class="tab" onclick="filterBookings('paid', this)">Paid</button>
      <button class="tab" onclick="filterBookings('rejected', this)">Rejected</button>
    </div>

    <!-- Bookings list -->
    <div class="bookings-list" id="bookingsList">
      <div class="loading">Loading bookings...</div>
    </div>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div class="pay-modal-overlay" id="payModal">
  <div class="pay-modal">
    <h3>Collect Payment — <span id="payBookingCode"></span></h3>
    <div class="pay-summary">
      <div class="pay-row"><span id="payGuestName">Guest</span><span id="payRoom"></span></div>
      <div class="pay-row"><span>Nights</span><span id="payNights"></span></div>
      <div class="pay-row total"><span>Total</span><span id="payTotal"></span></div>
    </div>
    <button class="btn-pay-razorpay" id="btnRazorpay" onclick="launchRazorpay()">Pay with Razorpay / UPI</button>
    <button class="btn-pay-close" onclick="closePayModal()">Close</button>
  </div>
</div>

<!-- Scripts — config MUST load before the module so window.* globals are available -->
<script src="../js/config.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<!-- Firebase -->
<script type="module">
  import { initializeApp }                                       from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'

  // ── Load config from parent folder ──────────────────────
  // Config is loaded via script tag in admin.js below
  // Wait for FIREBASE_CONFIG global to be available

  let app, auth, db
  let allBookings   = []
  let currentFilter = 'all'
  let currentPayBooking = null

  // Expose globals for inline onclick handlers
  window.doLogin      = doLogin
  window.doLogout     = doLogout
  window.filterBookings = filterBookings
  window.approveBooking = approveBooking
  window.rejectBooking  = rejectBooking
  window.openPayModal   = openPayModal
  window.closePayModal  = closePayModal
  window.launchRazorpay = launchRazorpay
  window.sendWhatsApp   = sendWhatsApp
  window.downloadInvoice = downloadInvoice

  // Wait for config to load
  window.addEventListener('load', () => {
    app  = initializeApp(FIREBASE_CONFIG)
    auth = getAuth(app)
    db   = getFirestore(app)

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('loginScreen').style.display  = 'none'
        document.getElementById('adminWrap').style.display    = 'block'
        document.getElementById('adminUser').textContent       = user.email
        loadBookings()
      } else {
        document.getElementById('loginScreen').style.display  = 'flex'
        document.getElementById('adminWrap').style.display    = 'none'
      }
    })
  })

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim()
    const pass  = document.getElementById('loginPassword').value
    const errEl = document.getElementById('loginError')
    errEl.textContent = ''
    try {
      await signInWithEmailAndPassword(auth, email, pass)
    } catch (e) {
      errEl.textContent = 'Invalid email or password. Please try again.'
    }
  }

  function doLogout() {
    if (confirm('Logout from admin panel?')) signOut(auth)
  }

  // ── Load + listen to bookings (real-time) ───────────────
  function loadBookings() {
    const q = query(collection(db, 'bookings'), orderBy('createdAt', 'desc'))
    onSnapshot(q, snapshot => {
      allBookings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }))
      updateStats()
      renderBookings()
    })
  }

  function updateStats() {
    const pending  = allBookings.filter(b => b.status === 'pending').length
    const approved = allBookings.filter(b => b.status === 'approved').length
    const paid     = allBookings.filter(b => b.status === 'paid').length
    const revenue  = allBookings.filter(b => b.status === 'paid').reduce((s, b) => s + (b.totalAmount || 0), 0)

    document.getElementById('statPending').textContent  = pending
    document.getElementById('statApproved').textContent = approved
    document.getElementById('statPaid').textContent     = paid
    document.getElementById('statRevenue').textContent  = '₹' + revenue.toLocaleString('en-IN')
  }

  function filterBookings(status, btn) {
    currentFilter = status
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    btn.classList.add('active')
    renderBookings()
  }

  function renderBookings() {
    const list     = document.getElementById('bookingsList')
    const filtered = currentFilter === 'all'
      ? allBookings
      : allBookings.filter(b => b.status === currentFilter)

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p>No bookings found.</p></div>`
      return
    }

    list.innerHTML = filtered.map(b => {
      const statusBadge = `<div class="badge badge-${b.status}">${b.status}</div>`
      const actions     = buildActions(b)
      return `
        <div class="booking-card status-${b.status}" id="card-${b.id}">
          <div>
            <div class="booking-id">${b.bookingCode || b.id.slice(0,8).toUpperCase()}</div>
            <div class="booking-guest">${b.customerName}</div>
            <div class="booking-phone">📞 ${b.customerPhone}</div>
            ${b.customerEmail ? `<div class="booking-phone">✉️ ${b.customerEmail}</div>` : ''}
          </div>
          <div>
            <div class="booking-room">🛏️ ${b.roomName}</div>
            <div class="booking-dates">📅 ${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}</div>
            <div class="booking-guests">👥 ${b.guests} guest${b.guests > 1 ? 's' : ''} · ${b.nights} night${b.nights > 1 ? 's' : ''}</div>
            ${b.specialRequests ? `<div class="booking-special">📝 ${b.specialRequests}</div>` : ''}
          </div>
          <div>
            ${statusBadge}
            <div class="booking-amount">₹${(b.totalAmount||0).toLocaleString('en-IN')}</div>
            <div class="booking-nights">₹${b.pricePerNight}/night × ${b.nights}</div>
            ${b.paymentId ? `<div style="font-size:.7rem;color:var(--success);margin-top:4px">✓ Paid · ${b.paymentId}</div>` : ''}
          </div>
          <div class="booking-actions">${actions}</div>
        </div>`
    }).join('')
  }

  function buildActions(b) {
    const id = b.id
    if (b.status === 'pending') {
      return `
        <button class="btn-approve" onclick="approveBooking('${id}')">✓ Approve</button>
        <button class="btn-reject"  onclick="rejectBooking('${id}')">✗ Reject</button>`
    }
    if (b.status === 'approved') {
      return `
        <button class="btn-wa"      onclick="sendWhatsApp('${id}')">💬 Send Invoice</button>
        <button class="btn-pay"     onclick="openPayModal('${id}')">💳 Take Payment</button>
        <button class="btn-invoice" onclick="downloadInvoice('${id}')">📄 Download PDF</button>`
    }
    if (b.status === 'paid') {
      return `
        <button class="btn-wa"      onclick="sendWhatsApp('${id}')">💬 Resend Receipt</button>
        <button class="btn-invoice" onclick="downloadInvoice('${id}')">📄 Download PDF</button>`
    }
    if (b.status === 'rejected') {
      return `<span style="font-size:.8rem;color:var(--muted)">Booking rejected</span>`
    }
    return ''
  }

  // ── Approve / Reject ────────────────────────────────────
  async function approveBooking(id) {
    const b = allBookings.find(x => x.id === id)
    if (!confirm(`Approve booking for ${b.customerName}?`)) return
    await updateDoc(doc(db, 'bookings', id), { status: 'approved' })
    // Automatically open WhatsApp to notify customer
    sendWhatsAppMsg(b, 'approved')
  }

  async function rejectBooking(id) {
    const b = allBookings.find(x => x.id === id)
    if (!confirm(`Reject booking for ${b.customerName}? This will notify the customer.`)) return
    await updateDoc(doc(db, 'bookings', id), { status: 'rejected' })
    sendWhatsAppMsg(b, 'rejected')
  }

  // ── WhatsApp Invoice / Notification ─────────────────────
  function sendWhatsApp(id) {
    const b = allBookings.find(x => x.id === id)
    sendWhatsAppMsg(b, b.status)
  }

  function sendWhatsAppMsg(b, type) {
    let msg = ''
    const code = b.bookingCode || b.id.slice(0,8).toUpperCase()

    if (type === 'approved') {
      msg = `✅ *BOOKING CONFIRMED — Jay Palace*\n\n` +
        `Dear ${b.customerName},\n\n` +
        `Your booking has been *confirmed*! Here are your details:\n\n` +
        `🆔 Booking ID: *${code}*\n` +
        `🛏️ Room: ${b.roomName}\n` +
        `📅 Check-in: ${fmtDate(b.checkIn)} (${HOTEL.checkIn})\n` +
        `📅 Check-out: ${fmtDate(b.checkOut)} (${HOTEL.checkOut})\n` +
        `🌙 Nights: ${b.nights}\n` +
        `👥 Guests: ${b.guests}\n` +
        `💰 Total Amount: *₹${(b.totalAmount||0).toLocaleString('en-IN')}*\n\n` +
        `📍 Address: ${HOTEL.address}\n\n` +
        `We look forward to welcoming you!\n` +
        `*Jay Palace, Saraipali*\n📞 ${HOTEL.phone}`
    } else if (type === 'rejected') {
      msg = `❌ *Booking Update — Jay Palace*\n\n` +
        `Dear ${b.customerName},\n\n` +
        `Unfortunately, we could not accommodate your booking (ID: ${code}) for the requested dates.\n\n` +
        `Please contact us to check availability:\n📞 ${HOTEL.phone}\n\n` +
        `We apologise for the inconvenience.\n*Jay Palace, Saraipali*`
    } else if (type === 'paid') {
      msg = `🧾 *PAYMENT RECEIPT — Jay Palace*\n\n` +
        `Dear ${b.customerName},\n\n` +
        `Thank you for your payment!\n\n` +
        `🆔 Booking ID: *${code}*\n` +
        `🛏️ Room: ${b.roomName}\n` +
        `📅 ${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}\n` +
        `💰 Amount Paid: *₹${(b.totalAmount||0).toLocaleString('en-IN')}*\n` +
        (b.paymentId ? `🔖 Payment Ref: ${b.paymentId}\n` : '') +
        `\nWe look forward to your stay!\n*Jay Palace, Saraipali*`
    } else {
      msg = `🏨 *Booking Update — Jay Palace*\n\n` +
        `Dear ${b.customerName},\n\n` +
        `Here is your booking summary:\n` +
        `🆔 ID: ${code}\n🛏️ ${b.roomName}\n` +
        `📅 ${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}\n` +
        `💰 ₹${(b.totalAmount||0).toLocaleString('en-IN')}\n\n` +
        `*Jay Palace*\n📞 ${HOTEL.phone}`
    }

    const phone = b.customerPhone.replace(/[\s\-+]/g, '')
    const waNum = phone.startsWith('0') ? '91' + phone.slice(1)
                : phone.startsWith('91') ? phone : '91' + phone
    window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`, '_blank')
  }

  // ── Payment Modal ────────────────────────────────────────
  function openPayModal(id) {
    const b = allBookings.find(x => x.id === id)
    currentPayBooking = b
    document.getElementById('payBookingCode').textContent = b.bookingCode || id.slice(0,8)
    document.getElementById('payGuestName').textContent   = b.customerName
    document.getElementById('payRoom').textContent        = b.roomName
    document.getElementById('payNights').textContent      = `${b.nights} night${b.nights>1?'s':''}`
    document.getElementById('payTotal').textContent       = `₹${(b.totalAmount||0).toLocaleString('en-IN')}`
    document.getElementById('payModal').classList.add('open')
  }
  function closePayModal() { document.getElementById('payModal').classList.remove('open') }

  function launchRazorpay() {
    const b = currentPayBooking
    if (!b) return
    const options = {
      key:         RAZORPAY_KEY,
      amount:      (b.totalAmount || 0) * 100,
      currency:    'INR',
      name:        'Jay Palace Hotel',
      description: `Room booking ${b.bookingCode} — ${b.roomName}`,
      prefill: {
        name:    b.customerName,
        contact: b.customerPhone,
        email:   b.customerEmail || '',
      },
      theme:  { color: '#C9A84C' },
      handler: async (response) => {
        await updateDoc(doc(db, 'bookings', b.id), {
          status:    'paid',
          paymentId: response.razorpay_payment_id,
        })
        closePayModal()
        // Send receipt to customer
        const paid = { ...b, status: 'paid', paymentId: response.razorpay_payment_id }
        sendWhatsAppMsg(paid, 'paid')
        alert(`✅ Payment successful!\nID: ${response.razorpay_payment_id}\nReceipt sent to customer via WhatsApp.`)
      },
    }
    const rzp = new Razorpay(options)
    rzp.on('payment.failed', e => alert('Payment failed: ' + e.error.description))
    rzp.open()
  }

  // ── Download Invoice PDF ─────────────────────────────────
  function downloadInvoice(id) {
    const b   = allBookings.find(x => x.id === id)
    const code = b.bookingCode || id.slice(0,8).toUpperCase()
    const lines = [
      '╔══════════════════════════════════════╗',
      '║         JAY PALACE HOTEL             ║',
      `║    ${HOTEL.address.padEnd(36)}║`,
      `║    📞 ${HOTEL.phone.padEnd(30)}║`,
      '╚══════════════════════════════════════╝',
      '',
      `  INVOICE / BOOKING CONFIRMATION`,
      `  Booking ID : ${code}`,
      `  Date       : ${new Date().toLocaleDateString('en-IN')}`,
      `  Status     : ${b.status.toUpperCase()}`,
      '',
      '  ─────────────────────────────────────',
      '  GUEST DETAILS',
      `  Name   : ${b.customerName}`,
      `  Phone  : ${b.customerPhone}`,
      `  Email  : ${b.customerEmail || 'N/A'}`,
      '',
      '  ─────────────────────────────────────',
      '  BOOKING DETAILS',
      `  Room       : ${b.roomName}`,
      `  Check-in   : ${fmtDate(b.checkIn)}  (${HOTEL.checkIn})`,
      `  Check-out  : ${fmtDate(b.checkOut)} (${HOTEL.checkOut})`,
      `  Nights     : ${b.nights}`,
      `  Guests     : ${b.guests}`,
      `  Rate/Night : ₹${(b.pricePerNight||0).toLocaleString('en-IN')}`,
      b.specialRequests ? `  Requests   : ${b.specialRequests}` : '',
      '',
      '  ─────────────────────────────────────',
      '  PAYMENT SUMMARY',
      `  Room charges : ₹${((b.pricePerNight||0) * b.nights).toLocaleString('en-IN')}`,
      b.gstAmount    ? `  GST          : ₹${b.gstAmount.toLocaleString('en-IN')}` : '',
      `  TOTAL        : ₹${(b.totalAmount||0).toLocaleString('en-IN')}`,
      b.paymentId    ? `  Payment Ref  : ${b.paymentId}` : '  Payment      : Pending',
      '',
      '  ─────────────────────────────────────',
      '  Thank you for choosing Jay Palace!',
      '  Website: Built by OM Technology',
      '  ─────────────────────────────────────',
    ].filter(l => l !== '').join('\n')

    const blob = new Blob([lines], { type: 'text/plain' })
    const url  = URL.createObjectURL(blob)
    const a    = Object.assign(document.createElement('a'), { href: url, download: `Invoice-${code}.txt` })
    a.click()
    URL.revokeObjectURL(url)
  }

  // ── Helpers ──────────────────────────────────────────────
  function fmtDate(d) {
    return d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'
  }
</script>
