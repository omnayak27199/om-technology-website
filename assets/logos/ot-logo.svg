<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OM Technology logo">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- O shape: ring -->
  <circle cx="26" cy="34" r="12" fill="none" stroke="white" stroke-width="5"/>
  <!-- T shape: crossbar + vertical bar, overlapping O -->
  <rect x="34" y="14" width="18" height="5" rx="2.5" fill="white"/>
  <rect x="40.5" y="14" width="5" height="32" rx="2.5" fill="white"/>
  <!-- Mask the O ring where T vertical overlaps — white fill to punch through -->
  <rect x="40" y="22" width="6" height="24" fill="url(#grad)"/>
  <!-- Redraw T vertical cleanly on top -->
  <rect x="40.5" y="19" width="5" height="28" rx="2.5" fill="white"/>
</svg>
